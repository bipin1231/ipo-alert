<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nepal IPO Alert</title>
    <meta
      name="description"
      content="Free Telegram alerts when a new IPO is listed on Nepal’s CDSC."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111;
        --muted: #5a5a5a;
        --paper: #f6f6f4;
        --tg: #2aabee;
        --tg-hover: #1f96d4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        display: grid;
        align-items: end;
        color: #fff;
        overflow: hidden;
      }

      .hero-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .hero-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
        transform: scale(1.02);
      }

      /* Hard scrim so type always sits on dark */
      .hero-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(8, 8, 8, 0.72) 0%,
            rgba(8, 8, 8, 0.45) 42%,
            rgba(8, 8, 8, 0.2) 100%
          ),
          linear-gradient(
            180deg,
            rgba(8, 8, 8, 0.25) 0%,
            rgba(8, 8, 8, 0.15) 35%,
            rgba(8, 8, 8, 0.88) 100%
          );
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        width: min(640px, 100%);
        padding: clamp(2rem, 6vw, 3.5rem);
        padding-bottom: clamp(2.75rem, 8vh, 4.5rem);
        animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .brand {
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: clamp(2.75rem, 9vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
        text-wrap: balance;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 1.1rem;
        font-size: clamp(1.1rem, 2.5vw, 1.3rem);
        font-weight: 500;
        max-width: 24ch;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.95);
      }

      .lede {
        margin-top: 0.65rem;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.78);
        max-width: 32ch;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        margin-top: 1.6rem;
        min-height: 3.1rem;
        padding: 0 1.35rem;
        background: var(--tg);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.98rem;
        border-radius: 8px;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .cta:hover {
        background: var(--tg-hover);
        transform: translateY(-1px);
      }

      .cta:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      .cta svg {
        width: 1.2rem;
        height: 1.2rem;
        flex-shrink: 0;
      }

      .cta-ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.45);
        margin-left: 0.65rem;
      }

      .cta-ghost:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
        margin-top: 1.6rem;
      }

      .cta-row .cta {
        margin-top: 0;
      }

      .below {
        width: min(640px, 100%);
        margin: 0 auto;
        padding: 3.25rem 1.5rem 4rem;
      }

      .below p {
        font-size: 1.05rem;
        color: var(--muted);
        max-width: 38ch;
      }

      .below a.link {
        color: var(--ink);
        font-weight: 650;
        font-weight: 600;
        text-underline-offset: 3px;
      }

      .below .cta {
        margin-top: 1.5rem;
      }

      footer {
        width: min(640px, 100%);
        margin: 0 auto;
        padding: 0 1.5rem 2.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      footer a {
        color: var(--ink);
        font-weight: 600;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-inner {
          animation: none;
        }
        .cta:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-bg">
        <img
          src="assets/hero-nepal.jpg"
          alt=""
          width="1920"
          height="1080"
          fetchpriority="high"
        />
      </div>
      <div class="hero-inner">
        <p class="brand">Nepal IPO Alert</p>
        <h1>New IPO on CDSC? Get it on Telegram.</h1>
        <p class="lede">Free group. Automatic alerts. No signup form.</p>
        <div class="cta-row">
          <a
            class="cta"
            href="https://t.me/+DXkmJFGx-uczZTQ9"
            rel="noopener noreferrer"
            target="_blank"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
              />
            </svg>
            Join the group
          </a>
        </div>
      </div>
    </header>

    <section class="below">
      <p>
        Watches
        <a class="link" href="https://cdsc.com.np/index.php/ipolist" rel="noopener noreferrer"
          >CDSC’s IPO list</a
        >
        every day and posts when a new company shows up — open/close dates, units, issue
        manager.
      </p>
      <a
        class="cta"
        href="https://t.me/+DXkmJFGx-uczZTQ9"
        rel="noopener noreferrer"
        target="_blank"
      >
        Join free on Telegram
      </a>
    </section>

    <footer>
      <a href="https://t.me/+DXkmJFGx-uczZTQ9" rel="noopener noreferrer" target="_blank"
        >Open Telegram group</a
      >
    </footer>
  </body>
</html>
